name: Noise fixture green and reversal proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Formatting and static analysis
        run: ./gradlew --no-daemon --stacktrace :libp2p:spotlessCheck :libp2p:detekt
      - name: First-attempt green and neighboring contracts
        run: |
          mkdir -p proof/green
          ./gradlew --no-daemon --stacktrace :libp2p:test \
            --tests 'io.libp2p.security.noise.NoiseReadyReentryTest' \
            --tests 'io.libp2p.security.noise.NoiseHandshakeOffEventLoopTest.*inline*' \
            --tests 'io.libp2p.security.noise.NoiseLoopPendingHandshakeTest' \
            --tests 'io.libp2p.security.noise.NoiseQueuedReadyCallbackTest' \
            --tests 'io.libp2p.security.noise.NoiseEstablishedConnectionTest' \
            --tests 'io.libp2p.security.noise.NoiseObserverCloseTest' \
            --tests 'io.libp2p.security.noise.NoiseHandshakeWriteFailureTest' \
            > proof/green/gradle.log 2>&1
          cp libp2p/build/test-results/test/TEST-*.xml proof/green/
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          roots = [E.parse(p).getroot() for p in pathlib.Path('proof/green').glob('TEST-*.xml')]
          assert roots, 'Green proof produced no XML'
          counts = {k: sum(int(r.get(k, '0')) for r in roots) for k in ('tests', 'failures', 'errors', 'skipped')}
          print('GREEN:', counts)
          assert counts['tests'] >= 37 and counts['failures'] == counts['errors'] == counts['skipped'] == 0, counts
          PY
      - name: Reverse the repairs and require the original assertion failures
        run: |
          mkdir -p proof/reversal
          for name in NoiseReadyReentryTest NoiseHandshakeOffEventLoopTest; do
            file="libp2p/src/test/kotlin/io/libp2p/security/noise/$name.kt"
            git show "20d7889d:$file" > "$file"
          done
          set +e
          ./gradlew --no-daemon --stacktrace :libp2p:cleanTest :libp2p:test \
            --tests 'io.libp2p.security.noise.NoiseReadyReentryTest' \
            --tests 'io.libp2p.security.noise.NoiseHandshakeOffEventLoopTest.*inline fixture*' \
            > proof/reversal/gradle.log 2>&1
          result=$?
          set -e
          cp libp2p/build/test-results/test/TEST-*.xml proof/reversal/
          python3 - "$result" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as E
          assert int(sys.argv[1]) != 0, 'Reversed repair must fail'
          roots = {p.name: E.parse(p).getroot() for p in pathlib.Path('proof/reversal').glob('TEST-*.xml')}
          ready = roots['TEST-io.libp2p.security.noise.NoiseReadyReentryTest.xml']
          inline = roots['TEST-io.libp2p.security.noise.NoiseHandshakeOffEventLoopTest.xml']
          exact = sum('expected: <3> but was: <4>' in f.get('message', '') for f in ready.findall('testcase/failure'))
          assert exact == 10, f'Expected10/10 exact pending4 failures; got{exact}'
          assert inline.get('tests') == inline.get('failures') == '20', inline.attrib
          assert all('NoiseHandshakeExecutionSnapshot' in f.get('message', '') for f in inline.findall('testcase/failure'))
          assert all(int(r.get('errors', '0')) == int(r.get('skipped', '0')) == 0 for r in roots.values())
          print('REVERSAL: reentry10/10 exact pending4; single10/10 and sequential10/10 exact inline assertions')
          PY
          git restore --source=HEAD -- \
            libp2p/src/test/kotlin/io/libp2p/security/noise/NoiseReadyReentryTest.kt \
            libp2p/src/test/kotlin/io/libp2p/security/noise/NoiseHandshakeOffEventLoopTest.kt
          git diff --exit-code
          git rev-parse HEAD > proof/tested-head.txt
          git hash-object libp2p/src/test/kotlin/io/libp2p/security/noise/NoiseReadyReentryTest.kt \
            libp2p/src/test/kotlin/io/libp2p/security/noise/NoiseHandshakeOffEventLoopTest.kt > proof/tested-source-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-green-reversal-proof
          path: |
            proof/**
            **/build/test-results/**
            **/build/reports/**
