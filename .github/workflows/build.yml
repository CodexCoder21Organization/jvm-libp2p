name: Kubo input proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bld-build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Inspect Kubo command input completion
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ipfs/kubo/releases/download/v0.34.1/kubo_v0.34.1_windows-amd64.zip -OutFile kubo.zip
          Expand-Archive kubo.zip -DestinationPath build/kubo-proof
          java investigations/hq100/KuboInputProof.java "$pwd/build/kubo-proof/kubo/ipfs.exe" "$pwd" 2>&1 | Tee-Object -FilePath kubo-input-proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubo-input-proof
          path: kubo-input-proof.txt
