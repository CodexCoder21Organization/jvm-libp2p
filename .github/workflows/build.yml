name: Noise fixture proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bld-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the listener isolation regression
        run: ./gradlew --no-daemon --max-workers=1 --stacktrace :libp2p:cleanTest :libp2p:test --tests 'io.libp2p.security.noise.NoiseHandshakeOffEventLoopTest.fixture listener stays separate*'
      - name: Upload first-attempt test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-fixture-proof
          path: |
            **/build/test-results/**
            **/build/reports/**
