name: Bld - Mapped readiness green
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-green:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            java: '17'
          - os: ubuntu-latest
            java: '11'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        id: kubo-java
        if: runner.os == 'Windows'
        with:
          distribution: temurin
          java-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Windows split runtimes
        if: runner.os == 'Windows'
        run: ./gradlew --no-daemon --stacktrace "-PkuboJavaHome=${{ steps.kubo-java.outputs.path }}" :libp2p:spotlessJavaApply :libp2p:test --tests '*NettyFutureConversionStateTest' --tests '*PendingNettyFutureConversionTest' :libp2p:kuboProcessTest :libp2p:spotlessCheck
      - name: Verify Linux minimum runtime
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon --stacktrace :libp2p:spotlessJavaApply :libp2p:test --tests '*QuicKuboTestJava' :libp2p:spotlessCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-readiness-green-${{ matrix.java }}
          path: |
            libp2p/build/test-results/**
            libp2p/src/test/java/io/libp2p/transport/quic/QuicKuboTestJava.java
