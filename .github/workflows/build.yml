name: build
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'funding.json'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'funding.json'
      - '.github/ISSUE_TEMPLATE/**'
permissions:
  contents: read

jobs:
  gradle:
    uses: ./.github/workflows/bld-build.yml