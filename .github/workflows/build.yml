name: Bld - Build and Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bld-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the peer publication regression
        run: ./gradlew --no-daemon --max-workers=1 --stacktrace :libp2p:cleanTest :libp2p:test --tests io.libp2p.network.NetworkRetirementOwnershipTest
      - name: Upload first results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-proof
          path: |
            **/build/test-results/**
            **/build/reports/**
