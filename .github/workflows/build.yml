name: Owned Kubo proof
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bld-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run real owned Kubo and static verification
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --continue :libp2p:cleanTest :libp2p:test --tests io.libp2p.transport.quic.QuicKuboTestJava :libp2p:detekt :libp2p:spotlessCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-kubo-proof-${{ matrix.os }}
          path: |
            **/build/test-results/**
            **/build/reports/**
