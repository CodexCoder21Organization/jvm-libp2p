name: W1 final consumer Linux build
on:
  push:
    branches: [proof/w1-linux-build-012118]

permissions:
  contents: read

jobs:
  bld-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14a7bf2a583c82d36ac6d092c288fa3248a57553
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - name: Verify the JDK 11 minimum
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build and test with Gradle
        run: ./gradlew --no-daemon --stacktrace --continue build dokkaJar
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-linux-reports
          path: |
            **/build/test-results/**
            **/build/reports/**
      - name: Check disk space
        if: always()
        run: df -h /
