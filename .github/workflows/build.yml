name: Bld - Review proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-red:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --stacktrace :libp2p:test --tests '*QuicKuboTestJava.readinessAlreadyBufferedWithoutFileNotification'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-red-reports
          path: libp2p/build/test-results/**
