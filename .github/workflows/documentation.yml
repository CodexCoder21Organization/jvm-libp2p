name: Documentation contract

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Android SDK setup uses JDK 17; the project build itself remains on JDK 11.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Verify documentation contract
        run: python3 scripts/verify-documentation.py

      - name: Upload documentation verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-verification
          path: build/documentation-verification/
          if-no-files-found: warn
          retention-days: 14
