name: Kubo workflow fixture proof
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  bld-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: 'sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

        df -h /

        '
    - name: Use JDK 17 for the Android SDK tools
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Prepare Android SDK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30"
        "build-tools;30.0.3"

        '
    - name: Verify the JDK 11 minimum
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
    - name: Install the Kubo integration-test binary
      shell: bash
      run: "set -euo pipefail\narchive=\"$RUNNER_TEMP/bld-kubo.tar.gz\"\ncurl --fail\
        \ --location --show-error --connect-timeout 30 --max-time 180 \\\n  https://github.com/ipfs/kubo/releases/download/v0.34.1/kubo_v0.34.1_linux-amd64.tar.gz\
        \ -o \"$archive\"\necho \"42045802fe60c64fb01350bc071190c534d600fe269759c06e27e22b2012fd3e\
        \  $archive\" | sha256sum --check\nmkdir \"$RUNNER_TEMP/bld-kubo\"\ntar -xzf\
        \ \"$archive\" -C \"$RUNNER_TEMP/bld-kubo\"\n"
    - name: Install the workflow integration-test dependency
      run: python3 -m pip install PyYAML==6.0.3
    - name: Verify workflow fixtures with the Java consumer
      run: python3 .github/scripts/test_kubo_workflows.py --runner-temp "$RUNNER_TEMP"
    - name: Upload test and build reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kubo-fixture-proof-reports
        path: 'build/kubo-workflow-results/**

          **/build/test-results/**

          **/build/reports/**

          ${{ runner.temp }}/bld-kubo.log

          '
    - name: Check disk space
      if: always()
      run: df -h /
