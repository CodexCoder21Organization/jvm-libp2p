name: Kubo workflow fixture proof
on:
  workflow_dispatch:
jobs:
  fixture-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 .github/scripts/test_kubo_workflows.py --contract-only
