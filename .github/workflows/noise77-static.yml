name: Noise77 static checks

on:
  push:
    branches:
      - proof/noise77-static

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Run static checks only
        run: ./gradlew :libp2p:spotlessCheck :libp2p:detekt
