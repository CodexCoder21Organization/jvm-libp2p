name: Dokka original cap and maintained regression controls 022124
on:
  push:
    branches: [proof/dokka-template-control-022124]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [html_templates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f6717ac782ab521ed39cdca7ab0eb024352b7fd7
          fetch-depth: 30
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: python3 diagnostics/mutate.py candidate ${{ matrix.mode }}
      - name: Verify the named assertion returns red after reversal
        run: python3 diagnostics/control.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversal-${{ matrix.mode }}
          path: |
            native-proof/**
            candidate/build/dokka-budget-proof/**
            candidate/build/documentation-verification/**
