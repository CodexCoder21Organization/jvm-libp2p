name: Standalone Javadoc assertion red proof

on:
  push:
    branches:
      - proof/dokka-standalone-red-040422
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d95cb4f6

      # Android SDK setup uses JDK 17; the project build itself remains on JDK 11.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Remove only the Javadoc alias dependency for the reversal control
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path("build.gradle")
          source = path.read_text()
          original = """    tasks.register('dokkaJavadoc') {
                  group = JavaBasePlugin.DOCUMENTATION_GROUP
                  dependsOn dokkaJavadocTask
              }"""
          replacement = """    tasks.register('dokkaJavadoc') {
                  group = JavaBasePlugin.DOCUMENTATION_GROUP
              }"""
          assert source.count(original) == 1, "Expected exactly one Javadoc alias dependency to remove"
          path.write_text(source.replace(original, replacement))
          PYTHON

      - name: Run the new standalone assertion against the unwired alias
        run: python3 scripts/verify-documentation.py

      - name: Upload documentation verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-assertion-red
          path: build/documentation-verification/
          if-no-files-found: warn
          retention-days: 14
