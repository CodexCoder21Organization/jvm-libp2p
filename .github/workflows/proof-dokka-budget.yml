name: Dokka maintained guard red 011701
on:
  push:
    branches: [proof/dokka-budget-011701]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [original, current]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90770ed03914800e7b459f3f018bb6df1c6814f9
          fetch-depth: 30
      - name: Restore original develop build configuration
        if: matrix.source == 'original'
        run: git restore --source=00dad34506398205174487a506c6cc6e4f8d2643 -- build.gradle.kts gradle.properties examples/android-chatter/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Run maintained regression assertions before repair
        run: python3 scripts/verify-documentation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintained-red-${{ matrix.source }}
          path: build/documentation-verification/**
