name: Noise77 capped caller proof
on:
  push:
    branches: [proof/noise77-capped-231540]
jobs:
  first-attempt-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/gradle-build-action@v2
      - name: First-attempt old address, isolated address, and reversal
        run: python3 .github/noise77-capped-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise77-capped-proof-${{ github.sha }}
          path: proof-results/
          if-no-files-found: error
