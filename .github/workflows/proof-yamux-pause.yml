name: Yamux paused-read ordering proof

on:
  push:
    branches:
      - proof/w2-yamux-pause

jobs:
  paused-read-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Run the original closing test
        run: >-
          ./gradlew :libp2p:test
          --tests 'io.libp2p.mux.yamux.YamuxPausedStreamKeepsConnectionReadingTest.closingAPausedStreamWithQueuedDataKeepsTheConnectionReading'
      - name: Verify the intended assertion failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          result = Path("libp2p/build/test-results/test/TEST-io.libp2p.mux.yamux.YamuxPausedStreamKeepsConnectionReadingTest.xml")
          if not result.exists():
              raise SystemExit(f"The targeted JUnit XML was not created: {result}")

          root = ET.parse(result).getroot()
          cases = root.findall("testcase")
          if len(cases) != 1:
              raise SystemExit(f"Expected exactly one targeted test case, got {len(cases)}")
          case = cases[0]
          name = case.attrib.get("name", "")
          if "closingAPausedStreamWithQueuedDataKeepsTheConnectionReading" not in name:
              raise SystemExit(f"Unexpected test ran: {name}")

          failures = case.findall("failure")
          errors = case.findall("error")
          skipped = case.findall("skipped")
          if errors or skipped or len(failures) != 1:
              raise SystemExit(
                  f"Expected one assertion failure and no errors/skips, got "
                  f"failures={len(failures)} errors={len(errors)} skipped={len(skipped)}"
              )

          failure = failures[0]
          details = failure.attrib.get("message", "") + "\n" + (failure.text or "")
          expected = (
              "Pressure-state payloads must remain held before close",
              "expected: <0>",
              "but was: <1>",
          )
          if not all(fragment in details for fragment in expected):
              raise SystemExit(f"Failure did not show the leaked pressure byte: {details}")
          print(f"EXPECTED RED: {name}; pressure-state count is 1, expected 0")
          PY
      - name: Upload targeted JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yamux-pause-proof-${{ github.sha }}
          path: libp2p/build/test-results/test/TEST-io.libp2p.mux.yamux.YamuxPausedStreamKeepsConnectionReadingTest.xml
          if-no-files-found: error
