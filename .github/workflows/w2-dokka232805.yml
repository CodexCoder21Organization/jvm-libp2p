name: W2 Dokka final proof and controls
on:
  push:
    branches: [proof/w2-dokka232805]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  html:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2c98aca53e8afeed781c4c59293b2ddb66b076c
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify the fixed legacy HTML command and real outputs
        run: python3 investigations/dokka232805/verify.py candidate investigations/dokka232805/budget.gradle proof html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-html-fixed
          path: |
            proof/**
            candidate/build/dokka-budget-proof/**
            candidate/**/build/dokka/**
  reversal:
    needs: html
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [memory, html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f2c98aca53e8afeed781c4c59293b2ddb66b076c
          fetch-depth: 3
          path: candidate
      - name: Restore only the original build for the memory control
        if: matrix.mode == 'memory'
        working-directory: candidate
        run: git checkout 00dad34506398205174487a506c6cc6e4f8d2643 -- build.gradle.kts gradle.properties README.md
      - name: Restore only the old HTML dependency for its control
        if: matrix.mode == 'html'
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle.kts')
          text = path.read_text()
          assert 'dependsOn(dokkaHtmlTask)' in text
          path.write_text(text.replace('dependsOn(dokkaHtmlTask)', 'dependsOn("dokkaGenerateHtml")'))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Confirm the expected assertion and original failure mechanism
        env:
          CONTROL: ${{ matrix.mode }}
        run: |
          set +e
          mode=reversal
          if [ "$CONTROL" = html ]; then mode=html-reversal; fi
          python3 investigations/dokka232805/verify.py candidate investigations/dokka232805/budget.gradle proof "$mode"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          suite = ET.parse('proof/TEST-DocumentationBuildBudgetTest.xml').getroot()
          assert suite.get('failures') == '1', 'The control must fail as an assertion.'
          text = Path('proof/gradle.log').read_text()
          if os.environ['CONTROL'] == 'memory':
              assert 'java.lang.OutOfMemoryError: Metaspace' in text, 'The original memory failure was not reproduced.'
          else:
              assert "Task with path 'dokkaGenerateHtml' not found" in text, 'The missing HTML dependency was not reproduced.'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-reversal-${{ matrix.mode }}
          path: |
            proof/**
            candidate/build/dokka-budget-proof/**
  collect:
    needs: [html, reversal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Preserve completed text and XML results without rerunning a test
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 investigations/dokka232805/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-summary
          path: evidence/**
