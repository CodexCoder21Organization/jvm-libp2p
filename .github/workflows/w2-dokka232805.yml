name: W2 Dokka strict red diagnosis
on:
  push:
    branches: [proof/w2-dokka232805]
permissions:
  contents: read
  actions: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop only the superseded proof if it is still active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          runs = json.loads(subprocess.check_output(['gh','api','repos/CodexCoder21Organization/jvm-libp2p/actions/runs?branch=proof%2Fw2-dokka232805&per_page=10']))['workflow_runs']
          stopped = []
          for run in runs:
              if run['head_sha'] == '942c83520b004b938db62465903c3691f6891b3d' and run['path'] == '.github/workflows/w2-dokka232805.yml' and run['status'] != 'completed':
                  subprocess.run(['gh','api','--method','POST',f'repos/CodexCoder21Organization/jvm-libp2p/actions/runs/{run["id"]}/cancel'],check=True)
                  stopped.append(run['html_url'])
          Path('proof').mkdir(exist_ok=True)
          Path('proof/superseded-runs.json').write_text(json.dumps(stopped,indent=2))
          print(stopped)
          PY
      - uses: actions/checkout@v4
        with:
          ref: f2c98aca53e8afeed781c4c59293b2ddb66b076c
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Reproduce the rejected root budget through the strict public build proof
        run: |
          set +e
          python3 investigations/dokka232805/verify.py candidate investigations/dokka232805/budget.gradle proof strict-red
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suite=ET.parse('proof/TEST-DocumentationBuildBudgetTest.xml').getroot()
          assert suite.get('failures')=='1'
          text=Path('proof/gradle.log').read_text()
          assert 'java.lang.OutOfMemoryError: Metaspace' in text
          assert 'Module was compiled with an incompatible version of Kotlin' in text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-strict-red
          path: |
            proof/**
            candidate/build/dokka-budget-proof/**
            candidate/build/root400.hprof
  collect:
    needs: red
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the actual failed build and assertion without another test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 investigations/dokka232805/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-summary
          path: evidence/**
