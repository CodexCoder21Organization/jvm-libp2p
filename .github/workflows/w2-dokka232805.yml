name: W2 Dokka bounded runtime proof
on:
  push:
    branches: [proof/w2-dokka232805]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [candidate, reversal]
        default: candidate
      target:
        type: string
        default: d254f9ed
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target || 'd254f9ed' }}
          fetch-depth: 2
          path: candidate
      - name: Restore the old build for the reversal control
        if: inputs.mode == 'reversal'
        working-directory: candidate
        run: git checkout HEAD^ -- build.gradle.kts gradle.properties README.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify real documentation and record owned runtimes
        run: python3 investigations/dokka232805/verify.py candidate investigations/dokka232805/budget.gradle proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-${{ inputs.mode || 'candidate' }}
          path: |
            proof/**
            candidate/build/dokka-budget-proof/**
            candidate/**/build/libs/*-javadoc.jar
