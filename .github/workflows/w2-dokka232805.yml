name: W2 Dokka strict validation and controls
on:
  push:
    branches: [proof/w2-dokka232805-html-budget]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [html]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 56fa8e02807b2ba38a5ca4dbf1eb6c899e2f32b8
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android build prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "build-tools;30.0.3"'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Check all documentation outcomes and reject new build errors
        run: python3 investigations/dokka232805/verify.py candidate investigations/dokka232805/budget.gradle proof ${{ matrix.mode }}
      - name: Record the public library metadata version
        if: always()
        run: |
          if [ -f candidate/libp2p/build/classes/kotlin/main/io/libp2p/core/Host.class ]; then
            javap -v -classpath candidate/libp2p/build/classes/kotlin/main io.libp2p.core.Host > proof/host-class.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-html-budget-red
          path: |
            proof/**
            candidate/build/dokka-budget-proof/**
            candidate/**/build/libs/*-javadoc.jar
            candidate/**/build/dokka/**
  collect:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Preserve completed results without another test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 investigations/dokka232805/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokka-budget232805-summary
          path: evidence/**
