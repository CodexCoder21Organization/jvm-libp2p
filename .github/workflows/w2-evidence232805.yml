name: Stop unintended legacy builds of evidence branches
on:
  push:
    branches: [proof/w2-yamux232805-collect]
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stop only this collector's legacy builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          repo='CodexCoder21Organization/jvm-libp2p'
          result=[]
          for run in json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?per_page=100']))['workflow_runs']:
              if run['name']=='build' and run['head_branch'].startswith('proof/w2-results232805-'):
                  result.append({k:run[k] for k in ['id','html_url','head_branch','status','conclusion']})
                  if run['status']!='completed':
                      subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{run["id"]}/cancel'],check=True)
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/collector-cleanup.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
          git config user.name Codex
          git config user.email codex@openai.com
          git switch -c proof/w2-yamux232805-collector-cleanup
          git add evidence/collector-cleanup.json
          git commit -m 'Record cancellation of unintended legacy evidence builds'
          git push origin HEAD:refs/heads/proof/w2-yamux232805-collector-cleanup
