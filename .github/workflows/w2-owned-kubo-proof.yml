name: W2 owned Kubo verification
on:
  push:
    branches: [verify/w2-owned-kubo-20261027]
  workflow_dispatch:
    inputs:
      jdk:
        type: choice
        options: ['17', '24']
        default: '17'
permissions:
  contents: read
jobs:
  owned-kubo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk || '17' }}
      - name: Check owned Kubo and immediate file release
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --max-workers=1 :libp2p:cleanTest :libp2p:test --tests io.libp2p.transport.quic.QuicKuboTestJava :libp2p:detekt :libp2p:spotlessCheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-owned-kubo-evidence
          path: |
            **/build/test-results/**
            **/build/reports/**
