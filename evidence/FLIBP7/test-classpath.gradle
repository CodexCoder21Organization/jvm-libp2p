gradle.projectsEvaluated {
    def target = gradle.rootProject.project(':libp2p')
    target.tasks.register('flibp7TestClasspath') {
        dependsOn target.tasks.named('testClasses')
        doLast {
            new File('/tmp/flibp7-upstream-test-classpath').text = target.sourceSets.test.runtimeClasspath.asPath
        }
    }
}
