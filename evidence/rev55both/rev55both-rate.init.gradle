gradle.projectsEvaluated {
    def project = gradle.rootProject.project(':libp2p')
    def ordinary = project.tasks.named('test', Test).get()
    (1..10).each { ordinal ->
        project.tasks.register("reviewShutdown${String.format('%02d', ordinal)}", Test) {
            dependsOn project.tasks.named('testClasses')
            testClassesDirs = ordinary.testClassesDirs
            classpath = ordinary.classpath
            javaLauncher = ordinary.javaLauncher
            workingDir = ordinary.workingDir
            minHeapSize = ordinary.minHeapSize
            maxHeapSize = ordinary.maxHeapSize
            jvmArgs ordinary.jvmArgs
            systemProperties ordinary.systemProperties
            enableAssertions = ordinary.enableAssertions
            maxParallelForks = 1
            forkEvery = 1
            useJUnitPlatform { excludeTags('interop') }
            filter { includeTestsMatching('io.libp2p.core.ParentCloseListenerReviewTest.mplexVisitorClosedChildrenReleaseParentCloseListeners') }
            outputs.upToDateWhen { false }
            testLogging {
                events('FAILED')
                exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
                showCauses = true
                showExceptions = true
                showStackTraces = true
            }
            beforeTest { descriptor -> println("RATE_ATTEMPT ${ordinal} ${descriptor.className} ${descriptor.name}") }
        }
    }
}
