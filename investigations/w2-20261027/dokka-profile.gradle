import java.lang.management.ManagementFactory

def profiles = new File(gradle.startParameter.currentDir, 'build/w2-dokka-profiles')
profiles.mkdirs()
def pid = ManagementFactory.runtimeMXBean.name.split('@')[0]
def record = { task, phase ->
    def report = new File(profiles, task.path.replace(':', '_') + '-' + phase + '.txt')
    report << "task=${task.path} phase=${phase} classes=${ManagementFactory.classLoadingMXBean.loadedClassCount}\n"
    ManagementFactory.memoryPoolMXBeans.each { pool -> report << "${pool.name}: ${pool.usage}\n" }
    def result = new ProcessBuilder(new File(System.getProperty('java.home'), 'bin/jcmd').path, pid, 'VM.classloader_stats')
        .redirectErrorStream(true).redirectOutput(ProcessBuilder.Redirect.appendTo(report)).start()
    if (!result.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
        result.destroyForcibly()
        throw new GradleException('Classloader diagnostic did not finish for ' + task.path)
    }
    if (result.exitValue() != 0) throw new GradleException('Classloader diagnostic failed: ' + report.text)
    def threads = new ProcessBuilder(new File(System.getProperty('java.home'), 'bin/jcmd').path, pid, 'Thread.print', '-l')
        .redirectErrorStream(true).redirectOutput(new File(profiles, task.path.replace(':', '_') + '-' + phase + '-threads.txt')).start()
    if (!threads.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
        threads.destroyForcibly()
        throw new GradleException('Thread diagnostic did not finish for ' + task.path)
    }
    if (threads.exitValue() != 0) throw new GradleException('Thread diagnostic failed for ' + task.path)
    println report.text
}
gradle.taskGraph.beforeTask { task ->
    if (task.name.startsWith('dokka') && task.name != 'dokkaJar') record(task, 'before')
    if (task.path == ':tools:schedulers:dokkaJavadoc') {
        def dump = new File(gradle.startParameter.currentDir, 'build/w2-dokka-before-schedulers.hprof')
        def capture = new ProcessBuilder(new File(System.getProperty('java.home'), 'bin/jcmd').path, pid,
            'GC.heap_dump', '-all', dump.absolutePath).inheritIO().start()
        if (!capture.waitFor(60, java.util.concurrent.TimeUnit.SECONDS)) {
            capture.destroyForcibly()
            throw new GradleException('Heap diagnostic did not finish')
        }
        if (capture.exitValue() != 0) throw new GradleException('Heap diagnostic failed')
    }
}
gradle.taskGraph.afterTask { task, state ->
    if (task.name.startsWith('dokka') && task.name != 'dokkaJar') record(task, 'after')
}
