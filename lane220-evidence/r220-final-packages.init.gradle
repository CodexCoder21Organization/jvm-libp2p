gradle.projectsEvaluated {
    def module = gradle.rootProject.project(':libp2p')
    def normal = module.tasks.named('test', Test).get()
    module.tasks.register('lane220FinalPackages', Test) {
        dependsOn module.tasks.named('testClasses')
        testClassesDirs = normal.testClassesDirs
        classpath = normal.classpath
        useJUnitPlatform { excludeTags('interop') }
        filter {
            includeTestsMatching('io.libp2p.mux.*')
            includeTestsMatching('io.libp2p.etc.util.netty.mux.*')
            includeTestsMatching('io.libp2p.core.*')
            includeTestsMatching('io.libp2p.network.*')
            includeTestsMatching('io.libp2p.host.*')
            includeTestsMatching('io.libp2p.transport.tcp.*')
            includeTestsMatching('io.libp2p.etc.util.netty.AbstractChildChannelCloseTest')
            includeTestsMatching('io.libp2p.transport.implementation.PlainNettyTransport*')
            includeTestsMatching('io.libp2p.transport.ParentCloseOwnershipTest')
        }
        maxParallelForks = 1
        outputs.upToDateWhen { false }
        testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
    }
}
