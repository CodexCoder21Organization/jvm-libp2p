gradle.projectsEvaluated {
    def module = gradle.rootProject.project(':libp2p')
    def normal = module.tasks.named('test', Test).get()
    (1..5).each { iteration ->
        module.tasks.register("lane220Repeat${iteration}", Test) {
            dependsOn module.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags('interop') }
            filter {
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.multiplePingChannelsOnTheSameConnection')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.echoOverSecureConnection')
                includeTestsMatching('io.libp2p.mux.ChildReadPauseTcpTest.offLoopPauseDuringInFlightDeliveryQueuesLaterFramesUntilResume')
            }
            maxParallelForks = 1
            testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
            if (iteration > 1) mustRunAfter ":libp2p:lane220Repeat${iteration - 1}"
        }
    }
}
