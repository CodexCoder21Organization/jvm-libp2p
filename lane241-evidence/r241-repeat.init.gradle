gradle.projectsEvaluated {
    def module = gradle.rootProject.project(':libp2p')
    def normal = module.tasks.named('test', Test).get()
    (1..5).each { iteration ->
        module.tasks.register("lane229BroaderRepeat${iteration}", Test) {
            dependsOn module.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags('interop') }
            filter {
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.twoEchosOverSecureConnection')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.unsupportedServerProtocol')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.echoOverSecureConnection')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.largeEchoOverSecureConnection')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.identifyOverSecureConnection')
                includeTestsMatching('io.libp2p.core.PlaintextTcpTest.multiplePingChannelsOnTheSameConnection')
                includeTestsMatching('io.libp2p.mux.ChildReadPauseTcpTest.offLoopPauseDuringInFlightDeliveryQueuesLaterFramesUntilResume')
                includeTestsMatching('io.libp2p.transport.NettyOutboundBufferBackpressureTest.normallyDrainingYamuxPeerReceivesBulkPayloadIntact')
                includeTestsMatching('io.libp2p.transport.NettyOutboundBufferBackpressureTest.peerThatStallsBelowBudgetThenResumesReceivesEveryAcceptedByte')
                includeTestsMatching('io.libp2p.pubsub.GossipApiTest.testFastMessageId')
                includeTestsMatching('io.libp2p.pubsub.gossip.GossipTwoHostTest.test message larger than mplex frame')
            }
            maxParallelForks = 1
            testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
            if (iteration > 1) mustRunAfter ":libp2p:lane229BroaderRepeat${iteration - 1}"
        }
    }
}
