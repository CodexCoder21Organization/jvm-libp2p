gradle.projectsEvaluated {
    def module = gradle.rootProject.project(':libp2p')
    def normal = module.tasks.named('test', Test).get()
    (1..10).each { iteration ->
        module.tasks.register("lane257Repeat${iteration}", Test) {
            dependsOn module.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags('interop') }
            filter {
                includeTestsMatching('io.libp2p.multistream.CoalescedNegotiationTcpTest')
                includeTestsMatching('io.libp2p.multistream.CoalescedProtocolSelectionTest')
                includeTestsMatching('io.libp2p.multistream.ProtocolSelectionCloseNotificationTest')
            }
            maxHeapSize = '128m'
            maxParallelForks = 1
            testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
            if (iteration > 1) mustRunAfter ":libp2p:lane257Repeat${iteration - 1}"
        }
    }
    ['Neighbors','Transport','Original'].each { group ->
        module.tasks.register("lane257${group}", Test) {
            dependsOn module.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags('interop') }
            filter {
                if (group == 'Neighbors') {
                    excludeTestsMatching('io.libp2p.mux.ChildReadPauseCoalescedRecordTest')
                    ['io.libp2p.mux.*', 'io.libp2p.multistream.*', 'io.libp2p.core.PlaintextTcpTest', 'io.libp2p.security.plaintext.*', 'io.libp2p.security.secio.SecIoNegotiatorTest', 'io.libp2p.core.MuxCloseDuringPublicationTest', 'io.libp2p.core.MuxSessionActivationTest'].each { includeTestsMatching(it) }
                } else if (group == 'Original') {
                    includeTestsMatching('io.libp2p.mux.ChildReadPauseCoalescedRecordTest')
                } else {
                    includeTestsMatching('io.libp2p.transport.*')
                }
            }
            maxParallelForks = 1
            testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
        }
    }
}
