allprojects {
    tasks.withType(Test).configureEach {
        maxHeapSize = '128m'
        maxParallelForks = 1
        systemProperty 'io.netty.leakDetection.level', 'paranoid'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
}
gradle.projectsEvaluated {
    def library = gradle.rootProject.project(':libp2p')
    def normal = library.tasks.named('test', Test).get()
    (1..10).each { iteration ->
        library.tasks.register("reviewFocused${iteration}", Test) {
            dependsOn library.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags 'interop' }
            filter {
                includeTestsMatching 'io.libp2p.multistream.CoalescedProtocolSelectionTest'
                includeTestsMatching 'io.libp2p.multistream.CoalescedNegotiationTcpTest'
                includeTestsMatching 'io.libp2p.multistream.ProtocolSelectionCloseNotificationTest'
            }
        }
    }
}
gradle.projectsEvaluated {
    gradle.rootProject.project(':libp2p').spotless {
        kotlin {
            target 'src/main/kotlin/io/libp2p/multistream/ProtocolSelect.kt',
                'src/test/kotlin/io/libp2p/multistream/CoalescedProtocolSelectionTest.kt',
                'src/test/kotlin/io/libp2p/multistream/ProtocolSelectionCloseNotificationTest.kt',
                'src/test/kotlin/io/libp2p/multistream/CoalescedNegotiationTcpTest.kt'
        }
    }
}
