gradle.projectsEvaluated {
    def module = gradle.rootProject.project(':libp2p')
    def normal = module.tasks.named('test', Test).get()
    def count = Integer.parseInt(System.getProperty('lane.count', '20'))
    def pattern = System.getProperty('lane.pattern', 'io.libp2p.mux.ChildReadPauseTcpTest.offLoopPauseDuringInFlightDeliveryQueuesLaterFramesUntilResume')
    (1..count).each { iteration ->
        module.tasks.register("lane269Repeat${iteration}", Test) {
            dependsOn module.tasks.named('testClasses')
            testClassesDirs = normal.testClassesDirs
            classpath = normal.classpath
            useJUnitPlatform { excludeTags('interop') }
            filter { includeTestsMatching(pattern) }
            maxParallelForks = 1
            maxHeapSize = '512m'
            testLogging { events 'FAILED'; exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
            outputs.upToDateWhen { false }
            if (iteration > 1) mustRunAfter ":libp2p:lane269Repeat${iteration - 1}"
        }
    }
}
